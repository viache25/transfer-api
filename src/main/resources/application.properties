spring.application.name=Transfer API

spring.datasource.url=jdbc:postgresql://localhost:5432/transferapi
spring.datasource.username=transferapi
spring.datasource.password=transferapi

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# Flush entity updates sorted by primary key, so two opposite transfers (A->B, B->A) lock the two
# account rows in the same order instead of deadlocking (found by the k6 load test)
spring.jpa.properties.hibernate.order_updates=true

spring.mvc.problemdetails.enabled=true

management.endpoints.web.exposure.include=health,prometheus
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# Redis only backs the idempotency cache; short timeouts so an outage falls back to the DB quickly,
# and its health must not take /actuator/health down
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=200ms
spring.data.redis.connect-timeout=200ms
management.health.redis.enabled=false

# The /ui pages keep the signed-in terminal in a server-side session (see SecurityConfig); its cookie
# is HttpOnly by default and never sent cross-site. Behind TLS also set server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=strict
