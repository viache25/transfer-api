name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push to the same branch/PR cancels the run it supersedes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write        # dorny/test-reporter publishes a check run with the JUnit results

jobs:
  build:
    runs-on: ubuntu-latest

    # No Postgres service: integration tests start their own PostgreSQL 16
    # through Testcontainers, using the runner's Docker daemon.
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v5

      - name: Build, test and verify coverage
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Coverage summary
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY" || true
          import re
          x = open('build/reports/jacoco/test/jacocoTestReport.xml').read()
          print('### Coverage\n\n| Counter | Covered |\n|---|---|')
          for t in ('LINE', 'BRANCH'):
              missed, covered = map(int, re.findall(r'<counter type="%s" missed="(\d+)" covered="(\d+)"/>' % t, x)[-1])
              print(f'| {t.lower()} | {covered / (missed + covered):.1%} |')
          PY

      - name: Publish test results
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: dorny/test-reporter@v3
        with:
          name: JUnit results
          # unit + integration (test) and REST Assured API tests (apiTest)
          path: build/test-results/test/*.xml,build/test-results/apiTest/*.xml
          reporter: java-junit
          use-actions-summary: false   # create a check run on the PR instead of only a job summary

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            build/reports/tests/
            build/reports/jacoco/
          retention-days: 14

  # Builds the production image exactly like cd.yml does, but never pushes it,
  # and smoke-tests it. CD only runs after merge (workflow_run), so without this
  # job a broken Dockerfile or image would only show up once it is on main.
  docker-image:
    name: Docker image (build + smoke test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build the image without pushing
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: transfer-api:ci

      # Only the executable Spring Boot jar has the layer tools; the plain jar
      # (no Main-Class) would fail here.
      - name: Check app.jar is the Spring Boot jar
        run: docker run --rm --entrypoint java transfer-api:ci -Djarmode=tools -jar app.jar list-layers

      # Same smoke test CD runs against the published image: start this image with
      # PostgreSQL + Redis, provision a terminal key, run scripts/smoke.sh.
      - name: Smoke test the image in an ephemeral environment
        run: scripts/smoke-ephemeral.sh transfer-api:ci
