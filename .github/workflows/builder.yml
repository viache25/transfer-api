name: Autonomous builder

on:
  schedule:
    # 10:00 UTC on weekdays = 12:00 Vienna in summer time, 11:00 in winter time.
    - cron: '0 10 * * 1-5'
  workflow_dispatch:
    inputs:
      step:
        description: 'Force a specific step number (optional)'
        required: false

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: builder
  cancel-in-progress: false

jobs:
  build-one-step:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - uses: anthropics/claude-code-action@v1
        env:
          PLAN_ISSUE: '1'
          FORCED_STEP: ${{ inputs.step }}
        with:
          # Use CLAUDE_CODE_OAUTH_TOKEN instead if you authenticate with a Pro/Max subscription.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --max-turns 120
          prompt: |
            You are the autonomous builder for this repository (Transfer API). You run once per weekday
            and complete ONE step of the plan. `gh` is authenticated; Docker and a JDK 21 toolchain are
            available on this runner.

            THE PLAN LIVES IN GITHUB ISSUE #1, NOT IN THE REPO.
            Read it with: gh issue view 1 --json body,comments
            The issue body is a checklist of steps plus a Decisions section. The progress log is the
            issue's comments, one comment per run.
            Never add PLAN.md, PROGRESS.md or any builder bookkeeping file to the repository.

            EACH RUN

            1. Read issue #1 (body + comments) and read CLAUDE.md and README.md in the repo.
            2. Pick the first unchecked step that is not marked BLOCKED in the body and has no open PR
               (check with: gh pr list --state open). If the environment variable FORCED_STEP is set and
               not empty, take that step number instead.
               If the comments contain two `failed` entries for that step, edit the issue body to mark it
               BLOCKED with the reason, comment why, and stop.
            3. Create branch `builder/step-N` from main and implement ONLY that step, following its
               acceptance criteria. At a fork, use the Decisions default from the issue body unless its
               switch condition is observed; say which you chose in the PR body.
            4. Verify with `./gradlew build --no-daemon`. Testcontainers works here: Docker is available.
               At most 2 fix attempts. If it still fails: delete the branch, comment
               `YYYY-MM-DD | step N | failed | reason` on issue #1, and stop without changing the checklist.
            5. On success: 1-3 conventional commits in English, push the branch, and open a PR to main
               titled `Step N: <title>` with the acceptance criteria as a checklist in the body.
               Then squash-merge it (`gh pr merge --squash --delete-branch`), because the build has
               already passed in this job.
            6. Tick the step's checkbox in the issue body (`gh issue edit 1 --body-file ...`) and add a
               comment `YYYY-MM-DD | step N | done | PR #x, note`. Never edit, reorder or delete steps;
               only tick them or mark them BLOCKED.
            7. If every step is ticked: open a final PR polishing the README, merge it, and comment on
               issue #1 that the plan is complete.

            RULES
            - Never force-push, never push directly to main, never commit secrets.
            - One step per run. Do not start a second step even if the first was small.
            - Keep CLAUDE.md accurate when behaviour changes.

            PROJECT NOTES
            Java 21, Spring Boot 4.1 / Spring 7 / Jackson 3 (tools.jackson.*), Gradle Kotlin DSL,
            PostgreSQL + Flyway (ddl-auto=validate, Instant -> TIMESTAMPTZ). Keep the layered structure
            (web/service/domain/repository/dto/exception), thin controllers, RFC 7807 errors.
