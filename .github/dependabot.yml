version: 2
updates:
  # Libraries and Gradle plugins from build.gradle.kts
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    groups:
      # One PR for all minor/patch bumps instead of one per library
      gradle-minor-and-patch:
        update-types: [minor, patch]

  # Action versions in .github/workflows/
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  # Base images in the Dockerfile (eclipse-temurin)
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
